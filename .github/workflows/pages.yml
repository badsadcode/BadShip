# Publishes the Shipyard Log (docs/devlog) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Only the devlog, its images and the front-page redirect go online; the rest of docs/ stays in the repo.
name: Devlog on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/devlog/**", "docs/images/**", "docs/index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          cp -r docs/devlog _site/devlog
          mkdir -p _site/images
          # Only the images the devlog uses.
          grep -oE '\.\./images/[A-Za-z0-9_.-]+' docs/devlog/index.html | sort -u | sed 's#\.\./images/##' | while read -r f; do cp "docs/images/$f" _site/images/; done
          touch _site/.nojekyll
          ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
