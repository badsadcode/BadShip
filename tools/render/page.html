<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BadShip render</title>
<style>
  body { margin: 0; background: #0d1117; color: #c9d1d9; font: 13px/1.3 system-ui, sans-serif; }
  #sheet { display: grid; gap: 8px; padding: 12px; background: #0d1117; width: max-content; }
  .cell { background: #141a22; border-radius: 6px; overflow: hidden; }
  .cell img { display: block; }
  .cap { padding: 6px 9px; display: flex; gap: 10px; justify-content: space-between; }
  .cap b { color: #e6edf3; }
  .cap .tag { color: #d9a43a; }
  .cap .ok { color: #57c278; } .cap .bad { color: #f0605a; }
  h1 { margin: 0 0 4px; font-size: 16px; grid-column: 1 / -1; color: #e6edf3; }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="sheet"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const loader = new GLTFLoader();

const VIEWS = {
  // Camera directions from the ship's centre. Bow (+Z) appears on the right in "quarter" and "side".
  quarter: new THREE.Vector3(-1, 0.5, 0.62),
  side: new THREE.Vector3(-1, 0, 0),
  top: new THREE.Vector3(0, 1, 0.0001),
  rear: new THREE.Vector3(-0.55, 0.35, -1),
  front: new THREE.Vector3(-0.45, 0.3, 1),
  low: new THREE.Vector3(-1, 0.14, 0.55),
  lowport: new THREE.Vector3(1, 0.14, 0.55),
  below: new THREE.Vector3(-1, -0.35, 0.6),
};

window.renderShip = async (url, { w = 640, h = 360, view = 'quarter', mode = 'beauty' } = {}) => {
  const gltf = await loader.loadAsync(url);
  const ship = gltf.scene;
  const markers = ship.getObjectByName('markers');
  if (markers) markers.visible = false;

  const scene = new THREE.Scene();
  scene.add(ship);
  if (mode === 'clay') {
    scene.background = new THREE.Color('#121821');
    scene.add(new THREE.HemisphereLight('#c9d6e6', '#20252c', 1.6));
    const k = new THREE.DirectionalLight('#ffffff', 2.4); k.position.set(-1, 1.4, 0.9); scene.add(k);
    const clay = new THREE.MeshStandardMaterial({ color: '#7fa0c4', roughness: 0.8, transparent: true, opacity: 0.85 });
    ship.traverse(o => { if (o.isMesh) o.material = clay; });
  } else if (mode === 'silhouette') {
    scene.background = new THREE.Color('#f2f2ee');
    const black = new THREE.MeshBasicMaterial({ color: '#111' });
    ship.traverse(o => { if (o.isMesh) o.material = black; });
  } else {
    scene.background = new THREE.Color('#121821');
    scene.environment = envMap;
    scene.environmentIntensity = 0.45;
    scene.add(new THREE.HemisphereLight('#a9bdd6', '#1a1e24', 0.9));
    const key = new THREE.DirectionalLight('#fff1dc', 3.2);
    key.position.set(-1.0, 1.4, 0.9);
    scene.add(key);
    const rim = new THREE.DirectionalLight('#7fa8ff', 1.3);
    rim.position.set(0.8, 0.4, -1);
    scene.add(rim);
  }

  const box = new THREE.Box3().setFromObject(ship);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dir = VIEWS[view].clone().normalize();
  let camera;
  if (mode === 'silhouette' || view === 'side' || view === 'top') {
    const aspect = w / h;
    // Fit the projected extents with a margin.
    const ext = view === 'top' ? [size.z, size.x] : [size.z, size.y];
    let halfW = ext[0] * 0.55, halfH = ext[1] * 0.55;
    if (halfW / halfH > aspect) halfH = halfW / aspect; else halfW = halfH * aspect;
    camera = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.1, 5000);
    camera.position.copy(center).addScaledVector(dir, size.length() * 2);
    camera.up.set(view === 'top' ? 1 : 0, view === 'top' ? 0 : 1, 0);
    if (view === 'top') camera.up.set(-1, 0, 0);
  } else {
    camera = new THREE.PerspectiveCamera(28, w / h, 0.5, 5000);
    const radius = size.length() / 2;
    const dist = radius / Math.sin((28 * Math.PI / 180) / 2) * (view.startsWith('low') || view === 'quarter' || view === 'below' ? 0.66 : 0.85);
    camera.position.copy(center).addScaledVector(dir, dist);
  }
  camera.lookAt(center);

  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  renderer.render(scene, camera);
  const data = renderer.domElement.toDataURL('image/png');
  ship.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  return data;
};

window.buildSheet = (title, cells, cols, cellW) => {
  const sheet = document.getElementById('sheet');
  sheet.style.gridTemplateColumns = `repeat(${cols}, ${cellW}px)`;
  sheet.innerHTML = `<h1>${title}</h1>`;
  for (const c of cells) {
    const div = document.createElement('div');
    div.className = 'cell';
    div.innerHTML = c.images.map(src => `<img src="${src}" width="${cellW}">`).join('') +
      `<div class="cap"><span><b>${c.name}</b> <span class="tag">${c.archetype} · ${c.family}</span></span>` +
      `<span>${c.length} m · ${c.prow} · <span class="${c.status === 'pass' ? 'ok' : 'bad'}">${c.status}</span></span></div>`;
    sheet.appendChild(div);
  }
  return Promise.all([...sheet.querySelectorAll('img')].map(i => i.decode()));
};
window.ready = true;
</script>
</body>
</html>
