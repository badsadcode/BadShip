<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BadShip render</title>
<style>
  body { margin: 0; background: #0d1117; color: #c9d1d9; font: 13px/1.3 system-ui, sans-serif; }
  #sheet { display: grid; gap: 8px; padding: 12px; background: #0d1117; width: max-content; }
  .cell { background: #141a22; border-radius: 6px; overflow: hidden; }
  .cell img { display: block; }
  .cap { padding: 6px 9px; display: flex; gap: 10px; justify-content: space-between; }
  .cap b { color: #e6edf3; }
  .cap .tag { color: #d9a43a; }
  .cap .ok { color: #57c278; } .cap .bad { color: #f0605a; }
  h1 { margin: 0 0 4px; font-size: 16px; grid-column: 1 / -1; color: #e6edf3; }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="sheet"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const loader = new GLTFLoader();

const VIEWS = {
  // Camera directions from the ship's centre. Bow (+Z) appears on the right in "quarter" and "side".
  quarter: new THREE.Vector3(-1, 0.5, 0.62),
  side: new THREE.Vector3(-1, 0, 0),
  top: new THREE.Vector3(0, 1, 0.0001),
  rear: new THREE.Vector3(-0.55, 0.35, -1),
  front: new THREE.Vector3(-0.45, 0.3, 1),
  low: new THREE.Vector3(-1, 0.14, 0.55),
  lowport: new THREE.Vector3(1, 0.14, 0.55),
  below: new THREE.Vector3(-1, -0.35, 0.6),
};

window.renderShip = async (url, { w = 640, h = 360, view = 'quarter', mode = 'beauty', eye = null, target = null, fov = 40, clip = null } = {}) => {
  // A cutaway: clip = [nx, ny, nz, d] keeps what lies on the side n·p + d >= 0.
  renderer.clippingPlanes = clip ? [new THREE.Plane(new THREE.Vector3(clip[0], clip[1], clip[2]), clip[3])] : [];
  const gltf = await loader.loadAsync(url);
  const ship = gltf.scene;
  const markers = ship.getObjectByName('markers');
  if (markers) markers.visible = false;

  const scene = new THREE.Scene();
  scene.add(ship);
  if (mode === 'clay') {
    scene.background = new THREE.Color('#121821');
    scene.add(new THREE.HemisphereLight('#c9d6e6', '#20252c', 1.6));
    const k = new THREE.DirectionalLight('#ffffff', 2.4); k.position.set(-1, 1.4, 0.9); scene.add(k);
    const clay = new THREE.MeshStandardMaterial({ color: '#7fa0c4', roughness: 0.8, transparent: true, opacity: 0.85 });
    ship.traverse(o => { if (o.isMesh) o.material = clay; });
  } else if (mode === 'silhouette') {
    scene.background = new THREE.Color('#f2f2ee');
    const black = new THREE.MeshBasicMaterial({ color: '#111' });
    ship.traverse(o => { if (o.isMesh) o.material = black; });
  } else {
    scene.background = new THREE.Color('#121821');
    scene.environment = envMap;
    scene.environmentIntensity = 0.45;
    scene.add(new THREE.HemisphereLight('#a9bdd6', '#1a1e24', 0.9));
    const key = new THREE.DirectionalLight('#fff1dc', 3.2);
    key.position.set(-1.0, 1.4, 0.9);
    scene.add(key);
    const rim = new THREE.DirectionalLight('#7fa8ff', 1.3);
    rim.position.set(0.8, 0.4, -1);
    scene.add(rim);
  }

  const box = new THREE.Box3().setFromObject(ship);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dir = VIEWS[view].clone().normalize();
  let camera;
  if (eye && target) {
    // A placed camera (a look through a window).
    camera = new THREE.PerspectiveCamera(fov, w / h, 0.05, 5000);
    camera.position.set(...eye);
    center.set(...target);
  } else if (mode === 'silhouette' || view === 'side' || view === 'top') {
    const aspect = w / h;
    // Fit the projected extents with a margin.
    const ext = view === 'top' ? [size.z, size.x] : [size.z, size.y];
    let halfW = ext[0] * 0.55, halfH = ext[1] * 0.55;
    if (halfW / halfH > aspect) halfH = halfW / aspect; else halfW = halfH * aspect;
    camera = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.1, 5000);
    camera.position.copy(center).addScaledVector(dir, size.length() * 2);
    camera.up.set(view === 'top' ? 1 : 0, view === 'top' ? 0 : 1, 0);
    if (view === 'top') camera.up.set(-1, 0, 0);
  } else {
    camera = new THREE.PerspectiveCamera(28, w / h, 0.5, 5000);
    const radius = size.length() / 2;
    const dist = radius / Math.sin((28 * Math.PI / 180) / 2) * (view.startsWith('low') || view === 'quarter' || view === 'below' ? 0.66 : 0.85);
    camera.position.copy(center).addScaledVector(dir, dist);
  }
  camera.lookAt(center);

  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  renderer.render(scene, camera);
  const data = renderer.domElement.toDataURL('image/png');
  ship.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  return data;
};

/** All ships of a fleet in one scene at true scale, bow to the right, smallest first, with labels and a scale bar. */
window.renderLineup = async (items, { w = 2400, h = 900, view = 'side', title = '' } = {}) => {
  // h is recomputed from the fleet's proportions below.
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#121821');
  scene.environment = envMap; scene.environmentIntensity = 0.45;
  scene.add(new THREE.HemisphereLight('#a9bdd6', '#1a1e24', 1.0));
  const key = new THREE.DirectionalLight('#fff1dc', 3.0); key.position.set(-1, 1.4, 0.9); scene.add(key);
  const rim = new THREE.DirectionalLight('#7fa8ff', 1.2); rim.position.set(0.8, 0.4, -1); scene.add(rim);
  // Two rows when there are many ships: small and medium on top, large below.
  const placed = [];
  let cursorZ = 0, maxY = 0;
  const gap = 18;
  for (const it of items) {
    const gltf = await loader.loadAsync(it.url);
    const ship = gltf.scene;
    const markers = ship.getObjectByName('markers'); if (markers) markers.visible = false;
    const box = new THREE.Box3().setFromObject(ship);
    const size = box.getSize(new THREE.Vector3());
    ship.position.set(-box.getCenter(new THREE.Vector3()).x, -box.min.y, cursorZ - box.min.z);
    scene.add(ship);
    placed.push({ it, z0: cursorZ, z1: cursorZ + size.z, top: size.y });
    cursorZ += size.z + gap;
    maxY = Math.max(maxY, size.y);
  }
  const totalZ = cursorZ - gap;
  // Fit the height to the tallest ship rather than wasting the frame.
  const halfW = totalZ * 0.52;
  const halfH = maxY * 0.62;
  h = Math.max(260, Math.round(w * halfH / halfW));
  const cam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.1, 10000);
  const cy = maxY * 0.45;
  const dir = view === 'low' ? new THREE.Vector3(-1, 0.12, 0).normalize() : new THREE.Vector3(-1, 0, 0);
  cam.position.set(dir.x * 3000, cy + dir.y * 3000, totalZ / 2);
  cam.lookAt(0, cy, totalZ / 2);
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  renderer.render(scene, cam);
  // Labels and a scale bar on a 2D canvas over the render.
  const out = document.createElement('canvas'); out.width = w; out.height = h + 200;
  const g = out.getContext('2d');
  g.fillStyle = '#121821'; g.fillRect(0, 0, out.width, out.height);
  g.drawImage(renderer.domElement, 0, 0);
  const toX = z => (z - (totalZ / 2 - halfW)) / (2 * halfW) * w;
  const groundY = h / 2 - (0 - cy) / halfH * (h / 2);
  g.textAlign = 'center';
  // Labels in up to three staggered rows so neighbours never overlap.
  const rowRight = [-1e9, -1e9, -1e9];
  for (const p of placed) {
    const x = toX((p.z0 + p.z1) / 2);
    g.font = '600 20px system-ui, sans-serif';
    const half = Math.max(g.measureText(p.it.label).width, g.measureText(p.it.sub).width) / 2 + 10;
    let row = rowRight.findIndex(rr => x - half > rr);
    if (row < 0) row = 0;
    rowRight[row] = x + half;
    const y = Math.min(groundY + 34, h - 4) + row * 52;
    g.fillStyle = '#e6edf3'; g.fillText(p.it.label, x, y);
    g.fillStyle = '#d9a43a'; g.font = '500 16px system-ui, sans-serif'; g.fillText(p.it.sub, x, y + 22);
  }
  const pxPerM = w / (2 * halfW);
  const bar = [10, 25, 50, 100].reduce((best, m) => (m * pxPerM < w * 0.12 ? m : best), 10);
  g.fillStyle = '#e6edf3'; g.fillRect(40, h + 176, bar * pxPerM, 6);
  g.font = '500 18px system-ui, sans-serif'; g.textAlign = 'left'; g.fillText(`${bar} m`, 40 + bar * pxPerM + 12, h + 184);
  g.textAlign = 'right'; g.fillStyle = '#8b98a8'; g.fillText(title, w - 40, h + 184);
  return out.toDataURL('image/png');
};

/** Renders every child of the first node (a layer) on its own, framed alone: a contact sheet of kit parts. */
window.renderParts = async (url, { w = 360, h = 240 } = {}) => {
  const gltf = await loader.loadAsync(url);
  const layer = gltf.scene.children[0];
  const parts = [...layer.children];
  const out = [];
  for (const part of parts) {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#121821');
    scene.environment = envMap; scene.environmentIntensity = 0.5;
    scene.add(new THREE.HemisphereLight('#a9bdd6', '#1a1e24', 1.0));
    const key = new THREE.DirectionalLight('#fff1dc', 2.8); key.position.set(-1, 1.4, 0.9); scene.add(key);
    const rim = new THREE.DirectionalLight('#7fa8ff', 1.2); rim.position.set(0.8, 0.4, -1); scene.add(rim);
    const holder = new THREE.Group();
    const clone = part.clone(true);
    // Neutral clay: the kit's own material is a very dark grey, and here the shapes are the point.
    const clay = new THREE.MeshStandardMaterial({ color: '#b8b6b0', roughness: 0.75, metalness: 0.05, side: THREE.DoubleSide });
    clone.traverse(o => { if (o.isMesh) o.material = clay; });
    holder.add(clone);
    scene.add(holder);
    const box = new THREE.Box3().setFromObject(holder);
    if (box.isEmpty()) continue;
    const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    const cam = new THREE.PerspectiveCamera(30, w / h, 0.01, 10000);
    const r = Math.max(size.length() / 2, 0.01);
    cam.position.copy(center).addScaledVector(new THREE.Vector3(-1, 0.6, 0.75).normalize(), r / Math.sin(15 * Math.PI / 180) * 0.75);
    cam.near = r / 100; cam.far = r * 100; cam.updateProjectionMatrix();
    cam.lookAt(center);
    renderer.setPixelRatio(1); renderer.setSize(w, h, false);
    renderer.render(scene, cam);
    let tris = 0;
    clone.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    out.push({ name: part.name, img: renderer.domElement.toDataURL('image/png'), tris: Math.round(tris), size: [size.x, size.y, size.z].map(v => +v.toFixed(2)) });
  }
  return out;
};

window.buildSheet = (title, cells, cols, cellW) => {
  const sheet = document.getElementById('sheet');
  sheet.style.gridTemplateColumns = `repeat(${cols}, ${cellW}px)`;
  sheet.innerHTML = `<h1>${title}</h1>`;
  for (const c of cells) {
    const div = document.createElement('div');
    div.className = 'cell';
    div.innerHTML = c.images.map(src => `<img src="${src}" width="${cellW}">`).join('') +
      `<div class="cap"><span><b>${c.name}</b> <span class="tag">${c.archetype} · ${c.family}</span></span>` +
      `<span>${c.length} m · ${c.prow} · <span class="${c.status === 'pass' ? 'ok' : 'bad'}">${c.status}</span></span></div>`;
    sheet.appendChild(div);
  }
  return Promise.all([...sheet.querySelectorAll('img')].map(i => i.decode()));
};
window.ready = true;
</script>
</body>
</html>
